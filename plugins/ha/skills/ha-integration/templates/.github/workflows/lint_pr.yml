name: Lint PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Nothing at workflow level: the job asks for the one scope it needs.
permissions: {}

jobs:
  main:
    name: CC title validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Every type the autolabeler maps, and only those. `revert:` is the one
          # the spec allows that maps to no label, so it would leave a PR with no
          # release category and nothing for the version to resolve from.
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            style
