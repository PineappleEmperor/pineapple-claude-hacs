name: PR Checks

# Every PR-time job that WRITES or READS labels, in one workflow so `needs:` can
# order them. Separate workflows cannot be sequenced: the only mechanism would be
# reacting to the `labeled` event, and GitHub suppresses events caused by the
# default GITHUB_TOKEN — so the autolabeler's own label never wakes anything.
# Consumers previously either raced it or polled for it. `needs:` removes both.
#
# Deliberately NOT here: lint_pr, hacs/hassfest/python validation, quality_audit.
# They neither read nor write labels, so folding them in would only couple
# unrelated failures and cost granular status checks.
#
# pull_request_target throughout, because a fork PR gets a read-only token under
# `pull_request` — it could not be labelled, commented on, or have its body
# updated, which is the whole point of these jobs.
# SAFETY: that trigger runs in the base repo's context with a writable token, so
# nothing here may execute PR-authored code. The autolabeler checks out nothing;
# title-check checks out the BASE and reads the PR's commits as data over the API,
# never the PR head.
on:
  pull_request_target:
    # NOT `labeled`/`unlabeled`. The autolabeler runs inside this workflow with the
    # default token, and GitHub suppresses events caused by that token, so those
    # types never fire for our own labels. They DO fire for external actors:
    # Dependabot applies three labels at once, which started five runs within two
    # seconds on ha-lego #22. `cancel-in-progress` killed four, and the cancelled
    # check-runs left the rollup FAILURE with nothing actually broken, so the PR
    # was unmergeable.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- label ----
  # The sole labeler. Everything below that reads labels declares `needs: label`.
  label:
    name: CC labelling
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The autolabeler only *adds*. When a PR's title flips type mid-life
      # (fix -> feat), the old label lingers and the PR lists under two
      # release-drafter categories. Remove superseded labels, keyed on the
      # same title the autolabeler reads (removal-only -> cannot flap).
      # The type lists below are the autolabeler's, from .github/release-drafter.yml,
      # and must stay in step with it: this once mapped only chore|docs, so a PR
      # retitled feat -> refactor gained `chore` and kept `feature`.
      - name: Remove superseded type labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # job has no checkout
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if   printf '%s' "$TITLE" | grep -qiE '^[a-z]+(\([^)]*\))?!:';        then WIN=xfeat
          elif printf '%s' "$TITLE" | grep -qiE '^(chore|docs|refactor|perf|test|build|ci|style)(\([^)]*\))?:'; then WIN=chore
          elif printf '%s' "$TITLE" | grep -qiE '^fix(\([^)]*\))?:';            then WIN=fix
          elif printf '%s' "$TITLE" | grep -qiE '^(feat|feature)(\([^)]*\))?:'; then WIN=feature
          else exit 0  # title maps to no managed label; leave labels untouched
          fi
          CURRENT=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          for L in xfeat feature fix chore; do
            [ "$L" = "$WIN" ] && continue
            # `if` (not `grep && gh`): a no-match grep as the step's last command
            # returns 1 under `bash -e`, failing the step even when nothing's wrong.
            if printf '%s\n' "$CURRENT" | grep -qx "$L"; then
              gh pr edit "$PR" --remove-label "$L"
            fi
          done

  # ----------------------------------------------------------- title-check ----
  # THE gate. `lint_pr` (title shape) and `label` (apply the label) are automation that
  # informs; this is the one job whose failure must stop a merge, because it is the only
  # one that asks whether the label is CORRECT rather than merely present. Reads labels,
  # so it must follow `label`; `needs` guarantees the autolabeler has finished, which is
  # what the old standalone workflow could not.
  title-check:
    name: CC label validation
    needs: label
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # checkout first: it clears the workspace, so it cannot run after a step
      # that wrote a file there. (skill_audit.py enforces this.)
      # base.ref, not base.sha: the sha is frozen at PR creation while this workflow
      # runs from the base branch head, so a scripts/ change merged mid-PR ran the new
      # workflow against the old script. Both are base-side; neither is PR-authored code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # The shipped scripts are written to the Python floor the whole stack declares
      # (pyproject.toml, pyrightconfig.json, python_validate.yml). The runner's own
      # python3 is older and rejected their syntax; version_sync.py holds every
      # workflow's python-version to that floor.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: The label must match what the commits entitle the PR to
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A label being PRESENT is not a label being CORRECT. The autolabeler derives it
          # from the TITLE, so a `fix:`-titled PR carrying a `feat!:` commit is labelled
          # `fix`, files under Fixes, and resolves a patch bump for a change that breaks
          # users. This compares the label the PR carries against the one its COMMITS
          # entitle it to; the mapping lives in commit_summary.py, where it is unit-tested.
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits" \
            --jq '.[].commit.message | split("\n")[0]' > subjects.txt
          EXPECTED=$(python3 scripts/commit_summary.py --mode label --subjects subjects.txt)
          ACTUAL=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(test("^(xfeat|feature|fix|chore)$"))] | unique | join(" ")' || true)
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "PR carries '$EXPECTED', which is what its commits entitle it to."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::label is '${ACTUAL:-none}' but these commits entitle this PR to '$EXPECTED'."
          fi

      - name: Say what the title should be, then fail
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ steps.check.outputs.expected }}
          ACTUAL: ${{ steps.check.outputs.actual }}
        run: |
          WIN=$(python3 scripts/commit_summary.py --mode winning --subjects subjects.txt)
          python3 - "$WIN" "$EXPECTED" "${ACTUAL:-none}" > comment.md <<'PYS'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("cs", "scripts/commit_summary.py")
          cs = importlib.util.module_from_spec(spec); spec.loader.exec_module(cs)
          title, category, bump = cs.SUGGESTIONS[sys.argv[1]]
          expected, actual = sys.argv[2], sys.argv[3]
          print(f"""<!-- pr-title-check -->
          ### This PR's label does not match its commits

          Label carried: **{actual}** — label its commits entitle it to: **{expected}**.

          The label is applied from the TITLE, and it decides the release category and the
          version bump. When the title understates the commits the change ships under the
          wrong heading with the wrong bump — a breaking change released as a patch is the
          case this exists to stop.

          **Retitle as {title}** — files under *{category}*, resolves a **{bump}** bump.

          Fix the title and this check goes green; the comment removes itself. Nothing here
          edits your title, and hand-patching the label will not help — the autolabeler
          rewrites it from the title on the next push.""".replace(chr(10) + " " * 10, chr(10)))
          PYS
          EXISTING=$(gh api "repos/$GH_REPO/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-title-check -->"))] | .[0].id // ""')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING" -F body=@comment.md --silent
          else
            gh pr comment "$PR" --body-file comment.md
          fi
          # The comment is the explanation; this is the gate. Before it failed here, the
          # required context reported success on every path and enforced nothing.
          exit 1

      - name: Withdraw the suggestion once the label is right
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          EXISTING=$(gh api "repos/$GH_REPO/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-title-check -->"))] | .[0].id // ""')
          [ -n "$EXISTING" ] && gh api -X DELETE "repos/$GH_REPO/issues/comments/$EXISTING" --silent \
            && echo "removed the stale suggestion" || echo "nothing to withdraw"

      # Reported here rather than in a job of its own. The release version is resolved
      # from the merged PRs' labels by release-drafter, so once the label is known to be
      # correct there is nothing further to validate — the old `version-gate` job
      # compared a committed manifest version that a tag-driven repo never carries, and
      # re-derived this same number through a second implementation.
      - name: Say what version this PR implies
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ steps.check.outputs.expected }}
        run: |
          LAST=$(gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1)
          LAST="${LAST#v}"
          [ -n "$LAST" ] || LAST="0.0.0"
          NEXT=$(python3 scripts/manifest_gate.py --suggest --last-release "$LAST" --labels "$EXPECTED")
          echo "::notice::label '$EXPECTED' implies the next release is ${NEXT} (currently v${LAST})"
          # A notice alone only lands on the run page. The step summary renders on the
          # PR's checks tab, which is where someone reading the PR will actually see it.
          {
            echo "### Next release"
            echo
            echo "| current | label | implies |"
            echo "|---|---|---|"
            echo "| v${LAST} | ${EXPECTED} | ${NEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"
