name: Python Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Ruff, Pyright and Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"   # HA's minimum; a matrix here would rename the
                                 # check-run to `lint-and-type (3.14)` and the
                                 # ruleset's required context would never report

      # uv resolves and installs the HA test stack in seconds where pip takes
      # minutes — homeassistant plus pytest-homeassistant-custom-component pull
      # several hundred packages, and every PR pays for it.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Keyed on what actually decides the dependency set. A key over the whole
          # repo re-resolves when a docstring changes; one that ignores these files
          # serves a stale environment after an HA bump.
          cache-dependency-glob: |
            requirements.test.txt
            pyproject.toml

      - name: Install
        run: |
          uv pip install --system homeassistant ruff pyright
          [ -f requirements.test.txt ] && uv pip install --system -r requirements.test.txt || true

      - name: Ruff
        # The whole repo under the shipped pyproject.toml, which is Home Assistant
        # core's own rule set: integration code, the copied scripts/ and tests/, and
        # conftest.py alike. Linting custom_components/ alone let the shipped copies
        # rot unseen. The format check keeps the tree as ruff format leaves it, so
        # no copied file ever needs a formatter exclusion.
        run: |
          ruff check .
          ruff format --check .

      - name: Pyright
        run: python -m pyright custom_components/

      - name: Pytest
        run: |
          if [ ! -d tests ]; then
            echo "::warning::no tests/ directory - quality_scale rules marked 'done' are unproven"
          elif [ ! -f requirements.test.txt ]; then
            echo "::error::tests/ exists but requirements.test.txt is missing"
            exit 1
          else
            pytest tests/ -q
          fi
