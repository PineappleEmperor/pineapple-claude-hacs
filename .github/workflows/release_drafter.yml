name: Release Drafter

# Two events, one writer. A push maintains the draft; `release: published` is the
# last thing to fire for both the draft-published and tag-pushed paths, so the body
# is written once, last. Draft creation does not fire `published`, and the write uses
# `gh release edit`, which fires `edited` — so this does not retrigger itself.
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    name: Auto draft releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # release_notes.py walks a tag..HEAD range. The default depth-1 clone
        # has no history, so the range fails to resolve.
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The shipped scripts are written to the Python floor the whole stack declares
      # (pyproject.toml, pyrightconfig.json, python_validate.yml). The runner's own
      # python3 is older and rejected their syntax; version_sync.py holds every
      # workflow's python-version to that floor.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # The version comes from the merged PRs, not from a file. Each PR's label carries
      # a semver-increment and the highest since the last release wins — the same model
      # the templates ship. `sync_plugin_version.yml` writes the number back to the
      # manifests when the release publishes, so nothing here reads them.
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        id: drafter
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        name: Resolve the version being released
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RESOLVED: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            V="${RELEASE_TAG#v}"
          else
            V="$RESOLVED"
          fi
          if [ -z "$V" ]; then
            echo "::error::no version resolved; a PR label with a semver-increment is required"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # release-drafter categorises by PR LABEL, one entry per PR, so a fix inside a
      # feat-titled PR files under Features. Surveyed HACS repos all group by the
      # TYPE OF CHANGE instead, one line each, linking to the PR. Generate the body
      # and overwrite what the drafter wrote; it still owns the draft and the version.
      - name: Generate notes grouped by commit type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The previous release is the last FULL one, never a prerelease. Measuring
          # from the newest release of any kind means v1.4.0rc2 covers only what
          # changed since rc1, and the final covers only what changed since rc2 —
          # so the release users actually read lists almost nothing. Measuring from
          # the last final makes every rc show the cumulative "what will ship", and
          # the final show the complete set.
          #
          # Excluding the release being written matters on `release: published`,
          # where it is already the newest non-draft and would otherwise match itself.
          PREV=$(gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease == false and .tagName != "v" + env.V)) | .[0].tagName // ""')
          # A repo's first release has no previous tag, so the range would be `..HEAD`
          # and every commit would be missed. Fall back to the root commit; the compare
          # link is dropped with it, since there is nothing to compare against.
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            PREV_ARG=(--previous "$PREV")
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            PREV_ARG=()
          fi
          # One draft, not two. A scaffolded integration keeps an rc draft beside the
          # full one because HACS users test candidates; a plugin marketplace ships
          # what main holds, so a candidate has nobody to test it. Publishing this
          # draft is the release, and `sync_plugin_version.yml` writes its tag back
          # into the manifests.
          gh release view "v$V" >/dev/null 2>&1 \
            || gh release create "v$V" --draft --title "v$V" --notes "pending"
          # New Contributors comes from GitHub's own generator, because "first
          # contribution" is its definition and reimplementing it would drift. This
          # endpoint only renders a body; it does not touch the release.
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$V" -f previous_tag_name="$PREV" --jq .body > gh_notes.md \
            || : > gh_notes.md
          python3 scripts/release_notes.py \
            --range "$RANGE" \
            --repo-url "https://github.com/$GH_REPO" \
            "${PREV_ARG[@]}" --version "$V" \
            --github-notes-file gh_notes.md > notes.md
          gh release edit "v$V" --notes-file notes.md

      # The release description is what users read, and nothing checked it. Every
      # earlier verification of the commit-summary block looked at the source text
      # or used a parser that disagrees with GitHub about list nesting, so a broken
      # block shipped in several releases while the checks stayed green.
      - name: Release notes render correctly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          python3 scripts/check_release_notes.py --tag "v$V" --version "$V"
