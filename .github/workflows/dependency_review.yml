name: Dependency Review

# Blocks a PR that introduces a dependency with a known advisory. Runs on the PR's
# own diff, so it costs nothing on branches that touch no dependencies.
#
# REQUIRES the repository's dependency graph to be enabled (Settings -> Advanced
# Security -> Dependency graph). Without it the action does NOT skip — it fails the
# check, so a repo that never enabled the graph gets a permanently red required check.
# Verified on a test repo with the graph off: this check failed while every other
# workflow passed. `scripts/bootstrap_repo.sh` enables it as part of repo setup.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Dependabot raises these on its own schedule; failing a human's unrelated
          # PR for a pre-existing low-severity advisory is noise, not a gate.
          fail-on-severity: high

# Dependency graph enabled 2026-08-23; this line re-triggers the PR checks.
